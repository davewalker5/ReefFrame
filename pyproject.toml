[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reef-frame"
version = "1.1.0"
description = "A Python desktop application for enhancing, stabilising and preparing underwater action-camera footage using FFmpeg"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "PySide6>=6.10,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
  "build>=1.2,<2",
  "pyinstaller>=6.16,<7"
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.gui-scripts]
reefframe = "main:main"

[tool.setuptools]
py-modules = ["main"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
config = ["defaults/*.json"]
resources = ["*.png"]
